services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: compostlab_tsdb
    environment:
      POSTGRES_DB: compostlab
      POSTGRES_USER: compostlab
      POSTGRES_PASSWORD: compostlab
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compostlab_backend
    env_file:
      - .env.backend
    environment: {}
    depends_on:
      - db
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: compostlab_frontend
    env_file:
      - ./frontend/.env.production
    environment:
      # 默认前端调用后端的 /api/v2（通过 NEXT_PUBLIC_API_BASE）
      # 这里使用宿主机端口映射（例如本机访问时使用 localhost:8001）
      NEXT_PUBLIC_API_BASE: http://localhost:8001/api/v2
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  tsdb_data:
