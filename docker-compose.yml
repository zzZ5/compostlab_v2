services:
  db:
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb:latest-pg16}
    container_name: compostlab_tsdb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-compostlab}
      POSTGRES_USER: ${POSTGRES_USER:-compostlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compostlab}
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compostlab_backend
    env_file:
      - .env.backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8000"
    volumes:
      - run_attachments:/app/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compostlab_migrate
    env_file:
      - .env.backend
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py migrate
    restart: "no"

  mqtt_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compostlab_mqtt_worker
    env_file:
      - .env.backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python manage.py mqtt_worker
    restart: unless-stopped

  mqtt_register_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compostlab_mqtt_register_worker
    env_file:
      - .env.backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python manage.py mqtt_register_worker
    restart: unless-stopped

  auto_control_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compostlab_auto_control_worker
    env_file:
      - .env.backend
    environment:
      AUTO_CONTROL_INTERVAL_SECONDS: ${AUTO_CONTROL_INTERVAL_SECONDS:-30}
      AUTO_CONTROL_ENABLE_THRESHOLDS: ${AUTO_CONTROL_ENABLE_THRESHOLDS:-1}
      AUTO_CONTROL_ENABLE_SCHEDULES: ${AUTO_CONTROL_ENABLE_SCHEDULES:-1}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python manage.py auto_control_worker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://compostlab-backend-v2.cpolar.cn/api/v2}
    container_name: compostlab_frontend
    env_file:
      - ./frontend/.env.production
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://compostlab-backend-v2.cpolar.cn/api/v2}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  tsdb_data:
  run_attachments:
