services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: compostlab_tsdb
    environment:
      POSTGRES_DB: compostlab
      POSTGRES_USER: compostlab
      POSTGRES_PASSWORD: compostlab
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compostlab_backend
    env_file:
      - .env.backend
    environment: {}
    depends_on:
      - db
    ports:
      - "8001:8000"

  mqtt_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compostlab_mqtt_worker
    env_file:
      - .env.backend
    environment:
      MQTT_HOST: 118.25.108.254
      MQTT_PORT: 1883
    depends_on:
      - backend
    command: python manage.py mqtt_worker
    restart: unless-stopped

  mqtt_register_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: compostlab_mqtt_register_worker
    env_file:
      - .env.backend
    environment:
      MQTT_HOST: 118.25.108.254
      MQTT_PORT: 1883
      MQTT_REGISTER_TOPIC: compostlab/v2/+/register
    depends_on:
      - backend
    command: python manage.py mqtt_register_worker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: https://compostlab-backend-v2.cpolar.cn/api/v2
    container_name: compostlab_frontend
    env_file:
      - ./frontend/.env.production
    environment:
      NEXT_PUBLIC_API_BASE: https://compostlab-backend-v2.cpolar.cn/api/v2
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  tsdb_data:
